<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 320px; padding: 20px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; background-color: #F9F6F0; color: #1A1513; }
    h1 { font-size: 20px; margin-top: 0; margin-bottom: 12px; font-weight: 800; letter-spacing: -0.5px; }
    h1 span { color: #E76F51; }
    p { font-size: 13px; color: #4A3F3A; margin-bottom: 16px; }
    input { width: 100%; padding: 10px; margin-bottom: 10px; border: 2px solid #EADFD4; border-radius: 8px; box-sizing: border-box; font-family: inherit; background: white; }
    input:focus { outline: none; border-color: #E76F51; }
    button { width: 100%; padding: 12px; background: #1A1513; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #E76F51; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { margin-top: 12px; font-size: 12px; text-align: center; font-weight: bold; color: #3F8F5C; display: none; }
    .footer { margin-top: 16px; font-size: 10px; text-align: center; color: #8A7A72; }
  </style>
</head>
<body>
  <h1>SCEAU<span>.</span></h1>
  <p>Scellez cette page instantanément sur Bitcoin.</p>
  
  <input type="text" id="apiKey" placeholder="Collez votre clé API (sceau_live_...)">
  <button id="sealBtn">🔒 Sceller cette page</button>
  <div id="status">✅ Page scellée avec succès !</div>
  
  <div class="footer">Générez votre clé sur sceau-app.vercel.app/settings</div>
  <script src="popup.js"></script>
</body>
</html>
